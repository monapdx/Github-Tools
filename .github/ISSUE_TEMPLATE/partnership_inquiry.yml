name: 🤝 Partnership Inquiry
description: Reach out about collaborating, cross-promotion, resource sharing, or other partnership opportunities
title: "[Partnership]: "
labels: ["partnership", "inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in partnering with [ORGANIZATION].

        Use this form for collaboration ideas such as:
        - cross-promotion
        - campaign collaboration
        - resource sharing
        - featured content or toolkit contributions
        - organizational partnerships
        - interviews, media, or event opportunities

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Your name
    validations:
      required: true

  - type: input
    id: organization
    attributes:
      label: Organization / project name
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Your role
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website or project link
      placeholder: https://...

  - type: input
    id: contact
    attributes:
      label: Best contact email
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: dropdown
    id: partnership_type
    attributes:
      label: Type of partnership
      options:
        - Cross-promotion
        - Content collaboration
        - Toolkit/resource collaboration
        - Campaign partnership
        - Event or speaking opportunity
        - Media / interview request
        - Research / educational collaboration
        - Other
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Partnership overview
      description: What kind of collaboration are you proposing?
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: textarea
    id: alignment
    attributes:
      label: Why this is a good fit
      description: How does this align with the mission and focus of the site?
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: What are you looking for specifically?
      description: Be as concrete as possible
      placeholder: [PLACEHOLDER TEXT]
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline (optional)
      placeholder: [PLACEHOLDER TEXT]

  - type: textarea
    id: additional_info
    attributes:
      label: Additional context (optional)
      placeholder: [PLACEHOLDER TEXT]

  - type: checkboxes
    id: confirmation
    attributes:
      label: Final check
      options:
        - label: This inquiry is relevant to [ORGANIZATION]
          required: true
        - label: I understand that submitting this form does not guarantee a partnership
          required: true
